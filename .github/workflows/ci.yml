name: "CI/CD: Quality Gates, Build and Deploy to AWS ECS"

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-validate-deploy:
    name: "Verify Quality & Deploy to AWS"
    runs-on: ubuntu-latest
    
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: "Set up JDK 21"
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # Ejecuta pruebas unitarias y envía el reporte a SonarCloud (IE3 e IE5)
      - name: "SonarQube Scan & Compliance Check"
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mvn clean verify sonar:sonar \
            -Dsonar.projectKey=TheRexInformatics_ingdevops_ev3 \
            -Dsonar.organization=therexinformatics \
            -Dsonar.host.url=https://sonarcloud.io

      # VALIDA EL QUALITY GATE (Mecanismo de interrupción - IE6)
      - name: "Quality Gate Break Check"
        uses: sonarsource/sonarqube-quality-gate-action@v1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          scanMetadataReportFile: target/sonar/report-task.txt
        timeout-minutes: 5

      # ==========================================
      # CONFIGURACIÓN Y AUTENTICACIÓN EN AWS
      # ==========================================
      - name: "Configurar credenciales AWS"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }} # Crucial para AWS Academy / Learner Labs
          aws-region: ${{ secrets.AWS_REGION }}

      - name: "Login en Amazon ECR"
        uses: aws-actions/amazon-ecr-login@v2

      # Construye la imagen Docker del Backend y la sube al registro privado ECR
      - name: "Build imagen Backend y push a ECR"
        run: |
          docker build -t suscripciones-backend .
          docker tag suscripciones-backend:latest 093239445247.dkr.ecr.us-east-1.amazonaws.com/suscripciones-backend:latest
          docker push 093239445247.dkr.ecr.us-east-1.amazonaws.com/suscripciones-backend:latest

      # ==========================================
      # DESPLIEGUE CONTINUO EN AWS ECS
      # ==========================================
      - name: "Descargar Task Definition actual"
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ secrets.ECS_TASK_DEFINITION_NAME }} \
            --query taskDefinition > task-definition.json

      - name: "Actualizar Tag de la imagen en la Task Def"
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: webapp  # Coincide exactamente con el "name" de tu JSON de ECS
          image: 093239445247.dkr.ecr.us-east-1.amazonaws.com/suscripciones-backend:latest

      - name: "Desplegar nueva Task Definition en el Servicio ECS"
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ secrets.ECS_SERVICE_NAME }}
          cluster: ${{ secrets.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: "Finalización Exitosa"
        run: echo "🚀 Calidad validada y Microservicio desplegado con éxito en AWS ECS"